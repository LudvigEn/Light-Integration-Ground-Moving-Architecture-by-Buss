name: Python tests

on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create test credentials
        shell: python
        env:
          TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
        run: |
          import os
          from pathlib import Path

          key = os.environ["TRAFIKLAB_API_KEY"]
          if not key:
            raise SystemExit("Missing TRAFIKLAB_API_KEY repository secret")

          Path("project/secrets.py").write_text(
            "API_KEY = " + repr(key) + "\n",
            encoding="utf-8",
          )

      - name: Run tests
        run: >
          python -m xmlrunner discover
          -s project/tests
          -p "*test*.py"
          -o test-results
          -v

      - name: Publish test results
        if: ${{ !cancelled() && hashFiles('test-results/*.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Individual test results
          path: test-results/*.xml
          reporter: python-xunit
          list-suites: all
          list-tests: all
          collapsed: never
