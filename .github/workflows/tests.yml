name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r t4s3-simulator/requirements.txt

      - name: Create test credentials
        shell: python
        env:
          TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
        run: |
          import os
          from pathlib import Path

          key = os.environ["TRAFIKLAB_API_KEY"]
          if not key:
            raise SystemExit("Missing TRAFIKLAB_API_KEY repository secret")

          Path("project/secrets.py").write_text(
            "API_KEY = " + repr(key) + "\n",
            encoding="utf-8",
          )

      - name: Run tests
        run: python -m unittest discover -s project/tests -p "*test*.py" -v
